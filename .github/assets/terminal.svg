<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 280" width="850" height="280">
  <style>
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    text { font-family: 'Courier New', Courier, monospace; }

    .l1 { opacity: 0; animation: fadeIn 0.3s ease forwards 0.5s; }
    .l2 { opacity: 0; animation: fadeIn 0.3s ease forwards 1.1s; }
    .l3 { opacity: 0; animation: fadeIn 0.3s ease forwards 1.9s; }
    .l4 { opacity: 0; animation: fadeIn 0.3s ease forwards 2.5s; }
    .l5 { opacity: 0; animation: fadeIn 0.3s ease forwards 3.3s; }
    .l6 { opacity: 0; animation: fadeIn 0.3s ease forwards 3.9s; }
    .l7 { opacity: 0; animation: fadeIn 0.3s ease forwards 4.6s; }
    .cursor { opacity: 0; animation: blink 1s step-end infinite 4.6s; }
  </style>

  <!-- Terminal body -->
  <rect x="0" y="0" width="850" height="280" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1"/>

  <!-- Title bar -->
  <rect x="1" y="1" width="848" height="34" rx="10" fill="#161B22"/>
  <rect x="1" y="25" width="848" height="10" fill="#161B22"/>

  <!-- Window buttons -->
  <circle cx="20" cy="18" r="5.5" fill="#FF5F56"/>
  <circle cx="38" cy="18" r="5.5" fill="#FFBD2E"/>
  <circle cx="56" cy="18" r="5.5" fill="#27C93F"/>

  <!-- Title text -->
  <text x="425" y="22" text-anchor="middle" font-size="12" fill="#8B949E">vikas@security-lab : ~/operations</text>

  <!-- Line 1: whoami command -->
  <g class="l1">
    <text x="20" y="65" font-size="14">
      <tspan fill="#00FF41" font-weight="bold">$ </tspan><tspan fill="#58A6FF">whoami</tspan>
    </text>
  </g>

  <!-- Line 2: whoami output -->
  <g class="l2">
    <text x="20" y="90" font-size="14" fill="#C9D1D9">vikas@security-lab</text>
  </g>

  <!-- Line 3: mission command -->
  <g class="l3">
    <text x="20" y="125" font-size="14">
      <tspan fill="#00FF41" font-weight="bold">$ </tspan><tspan fill="#58A6FF">cat mission.txt</tspan>
    </text>
  </g>

  <!-- Line 4: mission output -->
  <g class="l4">
    <text x="20" y="150" font-size="14">
      <tspan fill="#00FF41" font-weight="bold">Find</tspan><tspan fill="#FF7B72"> &#x2192; </tspan><tspan fill="#00FF41" font-weight="bold">Exploit</tspan><tspan fill="#FF7B72"> &#x2192; </tspan><tspan fill="#00FF41" font-weight="bold">Understand</tspan><tspan fill="#FF7B72"> &#x2192; </tspan><tspan fill="#00FF41" font-weight="bold">Secure</tspan>
    </text>
  </g>

  <!-- Line 5: status command -->
  <g class="l5">
    <text x="20" y="185" font-size="14">
      <tspan fill="#00FF41" font-weight="bold">$ </tspan><tspan fill="#58A6FF">./check_status.sh</tspan>
    </text>
  </g>

  <!-- Line 6: status output -->
  <g class="l6">
    <text x="20" y="210" font-size="14">
      <tspan fill="#00FF41">[##########] </tspan><tspan fill="#C9D1D9">All Systems Monitored</tspan>
    </text>
  </g>

  <!-- Line 7: ready prompt -->
  <g class="l7">
    <text x="20" y="248" font-size="14" fill="#00FF41" font-weight="bold">$</text>
  </g>

  <!-- Blinking cursor -->
  <rect class="cursor" x="33" y="236" width="8" height="15" fill="#00FF41"/>
</svg>
