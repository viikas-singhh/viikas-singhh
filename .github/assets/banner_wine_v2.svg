<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 135" width="900" height="135">
  <defs>
    <!-- Deep Navy Background Gradient -->
    <linearGradient id="navy-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050C1A" />
      <stop offset="50%" stop-color="#0A192F" />
      <stop offset="100%" stop-color="#0F223D" />
    </linearGradient>

    <!-- Wine Red Accent Gradient -->
    <linearGradient id="wine-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#800020" stop-opacity="0" />
      <stop offset="25%" stop-color="#B82042" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#E63946" stop-opacity="1" />
      <stop offset="75%" stop-color="#B82042" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#800020" stop-opacity="0" />
    </linearGradient>

    <!-- Scanline Laser Gradient -->
    <linearGradient id="laser-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B82042" stop-opacity="0" />
      <stop offset="50%" stop-color="#E63946" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#B82042" stop-opacity="0" />
    </linearGradient>

    <!-- Navy Cyber Grid -->
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#1B3B6F" stroke-width="0.6" stroke-opacity="0.4" />
    </pattern>

    <!-- Wine Glow Filter -->
    <filter id="wine-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes scan {
      0% { transform: translateY(0px); opacity: 0; }
      20% { opacity: 0.7; }
      80% { opacity: 0.7; }
      100% { transform: translateY(135px); opacity: 0; }
    }
    @keyframes winePulse {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 2px #B82042); }
      50% { opacity: 1; filter: drop-shadow(0 0 8px #E63946); }
    }
    @keyframes titleGlow {
      0%, 100% { fill: #B82042; }
      50% { fill: #E63946; }
    }

    .title {
      font-family: 'JetBrains Mono', 'Fira Code', 'Segoe UI', monospace;
      font-weight: 800;
      font-size: 33px;
      letter-spacing: 5px;
      fill: #FFFFFF;
    }
    .wine-text {
      animation: titleGlow 3s ease-in-out infinite;
    }
    .badge-text {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 2px;
      fill: #CCD6F6;
    }
    .tag {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 10.5px;
      font-weight: 700;
      fill: #FFFFFF;
      letter-spacing: 1.5px;
    }
    .scanline {
      animation: scan 4s ease-in-out infinite;
    }
    .pulse-elem {
      animation: winePulse 2.5s ease-in-out infinite;
    }
  </style>

  <!-- Container Box -->
  <rect width="900" height="135" rx="8" fill="url(#navy-grad)" stroke="#1E3A5F" stroke-width="1.2"/>
  <rect width="900" height="135" rx="8" fill="url(#grid)" />

  <!-- Animated Cyber Scanline -->
  <line x1="0" y1="0" x2="900" y2="0" stroke="url(#laser-grad)" stroke-width="1.8" class="scanline" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="900" height="2.5" fill="url(#wine-grad)" />

  <!-- Corner Brackets in Wine Red & White -->
  <path d="M 14 26 L 14 14 L 26 14" fill="none" stroke="#B82042" stroke-width="2" class="pulse-elem" />
  <path d="M 886 26 L 886 14 L 874 14" fill="none" stroke="#B82042" stroke-width="2" class="pulse-elem" />
  <path d="M 14 109 L 14 121 L 26 121" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8" />
  <path d="M 886 109 L 886 121 L 874 121" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8" />

  <!-- Status Pill -->
  <g transform="translate(360, 16)">
    <rect x="0" y="0" width="180" height="20" rx="10" fill="#0A192F" stroke="#B82042" stroke-width="1"/>
    <circle cx="15" cy="10" r="3.5" fill="#E63946" filter="url(#wine-glow)" class="pulse-elem"/>
    <text x="28" y="14" class="tag">CYBER_OPS // ACTIVE</text>
  </g>

  <!-- Main Name Title -->
  <text x="450" y="74" text-anchor="middle" class="title">
    VIKAS <tspan class="wine-text">SINGH</tspan>
  </text>

  <!-- Subtitle -->
  <text x="450" y="104" text-anchor="middle" class="badge-text">
    <tspan fill="#B82042">[</tspan> WEB &amp; APP SECURITY <tspan fill="#B82042">]</tspan>
    <tspan fill="#1E3A5F"> • </tspan>
    <tspan fill="#FFFFFF">[</tspan> CLOUD &amp; DEVSECOPS <tspan fill="#FFFFFF">]</tspan>
    <tspan fill="#1E3A5F"> • </tspan>
    <tspan fill="#B82042">[</tspan> IOT SECURITY <tspan fill="#B82042">]</tspan>
  </text>
</svg>
