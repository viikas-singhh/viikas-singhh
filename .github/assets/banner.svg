<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="900" height="130">
  <defs>
    <!-- Navy Blue Background Gradient -->
    <linearGradient id="navy-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050C18" />
      <stop offset="45%" stop-color="#0A192F" />
      <stop offset="100%" stop-color="#112240" />
    </linearGradient>

    <!-- Wine Red & Navy Accent Gradient -->
    <linearGradient id="wine-accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#800020" stop-opacity="0" />
      <stop offset="20%" stop-color="#800020" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#B82042" stop-opacity="1" />
      <stop offset="80%" stop-color="#800020" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#800020" stop-opacity="0" />
    </linearGradient>

    <!-- Navy Cyber Grid Pattern -->
    <pattern id="navy-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1B3B6F" stroke-width="0.7" stroke-opacity="0.45" />
    </pattern>

    <!-- Wine Red Glow Filter -->
    <filter id="wine-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 34px;
      letter-spacing: 4px;
      fill: #FFFFFF;
    }
    .badge-text {
      font-family: 'JetBrains Mono', 'Courier New', Courier, monospace;
      font-weight: 600;
      font-size: 12.5px;
      letter-spacing: 2px;
      fill: #CCD6F6;
    }
    .tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #FFFFFF;
      letter-spacing: 1px;
    }
  </style>

  <!-- Container -->
  <rect width="900" height="130" rx="8" fill="url(#navy-bg-grad)" stroke="#1E3A5F" stroke-width="1.2"/>
  <rect width="900" height="130" rx="8" fill="url(#navy-grid)" />

  <!-- Top Wine Red Accent Line -->
  <rect x="0" y="0" width="900" height="2.5" fill="url(#wine-accent-grad)" />

  <!-- Corner Tech Accents in Wine Red & White -->
  <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#B82042" stroke-width="1.8" />
  <path d="M 888 24 L 888 12 L 876 12" fill="none" stroke="#B82042" stroke-width="1.8" />
  <path d="M 12 106 L 12 118 L 24 118" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8" />
  <path d="M 888 106 L 888 118 L 876 118" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8" />

  <!-- Status Pill in Navy & Wine Red -->
  <g transform="translate(365, 18)">
    <rect x="0" y="0" width="170" height="20" rx="10" fill="#0A192F" stroke="#B82042" stroke-width="1"/>
    <circle cx="14" cy="10" r="3.5" fill="#B82042" filter="url(#wine-glow)"/>
    <text x="26" y="14" class="tag">CYBER_OPS // ACTIVE</text>
  </g>

  <!-- Main Name Title: White & Wine Red -->
  <text x="450" y="72" text-anchor="middle" class="title">
    VIKAS <tspan fill="#B82042">SINGH</tspan>
  </text>

  <!-- Subtitle with Navy & Wine Red Accents -->
  <text x="450" y="102" text-anchor="middle" class="badge-text">
    <tspan fill="#B82042">[</tspan> WEB &amp; APP SECURITY <tspan fill="#B82042">]</tspan>
    <tspan fill="#1E3A5F"> • </tspan>
    <tspan fill="#FFFFFF">[</tspan> CLOUD &amp; DEVSECOPS <tspan fill="#FFFFFF">]</tspan>
    <tspan fill="#1E3A5F"> • </tspan>
    <tspan fill="#B82042">[</tspan> IOT SECURITY <tspan fill="#B82042">]</tspan>
  </text>
</svg>
