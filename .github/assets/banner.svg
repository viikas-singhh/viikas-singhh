<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="900" height="130">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C10" />
      <stop offset="50%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF41" stop-opacity="0" />
      <stop offset="25%" stop-color="#00FF41" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#58A6FF" stop-opacity="1" />
      <stop offset="75%" stop-color="#00FF41" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00FF41" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="cyber-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#21262D" stroke-width="0.75" stroke-opacity="0.5" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 34px;
      letter-spacing: 4px;
      fill: #FFFFFF;
    }
    .badge-text {
      font-family: 'JetBrains Mono', 'Courier New', Courier, monospace;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 2px;
      fill: #8B949E;
    }
    .highlight {
      fill: #00FF41;
      font-weight: bold;
    }
    .tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      fill: #58A6FF;
      letter-spacing: 1px;
    }
  </style>

  <!-- Container -->
  <rect width="900" height="130" rx="8" fill="url(#bg-grad)" stroke="#30363D" stroke-width="1"/>
  <rect width="900" height="130" rx="8" fill="url(#cyber-grid)" />

  <!-- Top Accent Line -->
  <rect x="0" y="0" width="900" height="2" fill="url(#accent-grad)" />

  <!-- Corner Tech Accents -->
  <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#00FF41" stroke-width="1.5" />
  <path d="M 888 24 L 888 12 L 876 12" fill="none" stroke="#00FF41" stroke-width="1.5" />
  <path d="M 12 106 L 12 118 L 24 118" fill="none" stroke="#58A6FF" stroke-width="1.5" />
  <path d="M 888 106 L 888 118 L 876 118" fill="none" stroke="#58A6FF" stroke-width="1.5" />

  <!-- Terminal Status Pill -->
  <g transform="translate(370, 18)">
    <rect x="0" y="0" width="160" height="18" rx="9" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <circle cx="12" cy="9" r="3.5" fill="#00FF41" filter="url(#glow)"/>
    <text x="24" y="13" class="tag">SEC_OPS // ONLINE</text>
  </g>

  <!-- Main Name Title -->
  <text x="450" y="70" text-anchor="middle" class="title">
    VIKAS <tspan fill="#00FF41">SINGH</tspan>
  </text>

  <!-- Subtitle with Bullet Dividers -->
  <text x="450" y="100" text-anchor="middle" class="badge-text">
    <tspan fill="#58A6FF">[</tspan> SOC ANALYST <tspan fill="#58A6FF">]</tspan>
    <tspan fill="#30363D"> • </tspan>
    <tspan fill="#00FF41">[</tspan> THREAT DETECTION <tspan fill="#00FF41">]</tspan>
    <tspan fill="#30363D"> • </tspan>
    <tspan fill="#58A6FF">[</tspan> SECURITY AUTOMATION <tspan fill="#58A6FF">]</tspan>
  </text>
</svg>
